<div class="layout-container">
  <!-- Ouve a ação de fechar e passa o estado do signal -->
  <app-sidebar 
    [estaAberta]="sidebarAberta()" 
    (onFechar)="fecharSidebar()">
  </app-sidebar>

  <main class="conteudo-principal">
    <!-- Ouve o clique do botão hambúrguer para abrir/fechar -->
    <app-head-notification 
      (onToggleSidebar)="toggleSidebar()">
    </app-head-notification>

    <!-- Conteúdo das páginas -->
    <router-outlet></router-outlet>
  </main>
</div>
