<div class="painel-container">
  <!-- Cabeçalho de Boas-vindas -->
  <header class="painel-header">
    <h1>{{ greeting() }}, Prof. {{ professorName() }}</h1>
    <p class="painel-date">
      <i class="fi fi-rr-calendar"></i>
      {{ formattedDate() }}
    </p>
  </header>

  <!-- Linha 1: Stat Cards (4 cards de resumo) -->
  <div class="painel-grid-stats">
    <app-stat-card
      title="Total de Alunos"
      value="125"
      subtitle="em 4 turmas ativas"
      iconClass="fi fi-rr-users-alt"
      variant="chart-1"
    >
    </app-stat-card>

    <app-stat-card
      title="Média Geral"
      value="7.4"
      subtitle="+0.3 desde junho"
      iconClass="fi fi-rr-chart-line-up"
      variant="chart-2"
    >
    </app-stat-card>

    <app-stat-card
      title="Próximas provas"
      value="3"
      subtitle="nos próximos 30 dias"
      iconClass="fi fi-rr-calendar"
      variant="chart-3"
    >
    </app-stat-card>

    <app-stat-card
      title="Taxa de Aprovação"
      value="80%"
      subtitle="Acima de 6,0"
      iconClass="fi fi-rr-medal"
      variant="chart-4"
    >
    </app-stat-card>
  </div>

  <!-- Linha 2: Gráficos (Proporção 2:1) -->
  <div class="painel-grid-charts">
    <app-chart-desempenho></app-chart-desempenho>
    <app-distribuicao-notas></app-distribuicao-notas>
  </div>

  <!-- Linha 3: Cards de Lista (Proporção 50% - 50%) -->
  <div class="painel-grid-cards">
    <app-provas-card></app-provas-card>
    <app-alunos-destaque-card></app-alunos-destaque-card>
  </div>
</div>
